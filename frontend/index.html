<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b3a" />
  <title>Goodwill Gold — Thrift Price Scanner</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-bar">
    <span class="logo">🪙</span>
    <h1>Goodwill&nbsp;Gold</h1>
    <span class="tagline">Is it a steal?</span>
  </header>

  <main id="app">
    <!-- Capture / input card -->
    <section class="card" id="capture-card">
      <label class="shoot-btn" for="camera">
        <span class="shoot-icon">📷</span>
        <span>Snap the item</span>
        <input id="camera" type="file" accept="image/*" capture="environment" multiple hidden />
      </label>

      <div id="thumbs" class="thumbs" aria-label="Selected photos"></div>

      <div class="manual">
        <input id="make-model" type="text" inputmode="text"
               placeholder="…or type make &amp; model (e.g. Sony WH-1000XM4)" />
        <textarea id="notes" rows="2"
                  placeholder="Notes (flaws, size, what's included)…"></textarea>
      </div>

      <button id="analyze-btn" class="primary-btn" type="button">Check the price</button>
      <p class="hint">Add a photo or type a make/model, then tap Check.</p>
    </section>

    <!-- Follow-up card (more photos / accessories) -->
    <section class="card follow-up hidden" id="followup-card">
      <h2 id="followup-title">One more thing…</h2>
      <div id="followup-body"></div>
      <div id="accessory-buttons" class="accessory-buttons hidden">
        <button class="yes-btn" type="button" data-acc="yes">Yes, included</button>
        <button class="no-btn" type="button" data-acc="no">No / missing</button>
      </div>
      <button id="followup-continue" class="primary-btn hidden" type="button">
        I added the photos — re-check
      </button>
    </section>

    <!-- Result card -->
    <section class="card result hidden" id="result-card"></section>

    <!-- Loading overlay -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p id="loading-text">Identifying &amp; searching the lines…</p>
    </div>

    <!-- Error toast -->
    <div id="error" class="error hidden"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
